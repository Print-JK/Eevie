<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eevie Agent</title>
  <link rel="stylesheet" href="sidebar.css" />
</head>
<body>
  <div class="eevie-container">
    <header class="eevie-header">
      <div class="header-left">
        <h2>Eevie</h2>
        <span class="status-badge">Local (qwen2.5:3b)</span>
      </div>
      <div class="header-controls">
        <button id="tts-toggle" class="icon-button" type="button" title="Voice replies are on">🔊 Voice</button>
        <button id="settings-btn" class="icon-button" type="button" title="Open Eevie settings">⚙ Settings</button>
      </div>
    </header>

    <main id="chat-stream" class="chat-viewport"></main>

    <footer class="input-section">
      <div class="mode-toggles">
        <button id="mode-text-btn" class="toggle-tab active" type="button">Text</button>
        <button id="mode-voice-btn" class="toggle-tab" type="button">Voice</button>
      </div>

      <!-- Text Mode Panel -->
      <div id="text-input-panel" class="input-panel">
        <textarea id="prompt-input" placeholder="Ask Eevie, summarize the page, or say “pause video”..."></textarea>
        <button id="send-btn" type="button">Send</button>
      </div>

      <!-- Voice Mode Panel -->
      <div id="voice-input-panel" class="input-panel hidden">
        <button id="mic-trigger" class="mic-button" type="button">
          <span class="mic-icon">🎙️</span>
          <span id="mic-label">Press to Talk</span>
        </button>
        <p class="voice-help">Press once to start listening, speak, then press again to send. Commands such as “pause video” run on the active tab.</p>
      </div>
    </footer>
  </div>

  <script type="module" src="panel.js"></script>
</body>
</html>
